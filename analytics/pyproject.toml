[project]
name = "home-automation-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "dagster>=1.7.0",
  "dagster-webserver>=1.7.0",
]

[project.optional-dependencies]
# Placeholder for future analytics deps (e.g., numpy, scipy).

[tool.dagster]
module_name = "definitions"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["analytics*"]
